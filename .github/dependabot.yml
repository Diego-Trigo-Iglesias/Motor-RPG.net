# Configuracion de Dependabot.
# Actualizaciones automaticas de dependencias y de las GitHub Actions.
# Comprobacion semanal, los lunes a las 04:00 (Europe/Madrid).

version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Madrid"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "04:00"
      timezone: "Europe/Madrid"
